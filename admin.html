<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haseeb Global Admin</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#0A0A0A;color:#fff}.login{height:100vh;display:flex;align-items:center;justify-content:center}.card{background:#161616;border:1px solid #333;padding:30px;border-radius:15px;width:90%;max-width:380px}input{width:100%;padding:12px;background:#0A0A0A;border:1px solid #333;border-radius:10px;color:#fff;margin-bottom:10px}.btn{width:100%;padding:12px;background:#FFD60A;color:#000;border:0;border-radius:10px;font-weight:bold;cursor:pointer}.dash{display:none}.sidebar{width:240px;background:#161616;border-right:1px solid #333;height:100vh;position:fixed;padding:20px}.menu div{padding:10px;border-radius:8px;cursor:pointer;color:#aaa;margin-bottom:4px}.menu div.active{background:#FFD60A;color:#000}.main{margin-left:240px;padding:20px}.glass{background:#161616;border:1px solid #333;border-radius:12px;padding:18px;margin-bottom:15px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}.item{background:#0A0A0A;border:1px solid #333;border-radius:10px;overflow:hidden}.item img{width:100%;height:150px;object-fit:cover}.info{padding:8px}</style></head><body>
<div id="loginBox" class="login"><div class="card"><h2 style="color:#FFD60A;text-align:center;margin-bottom:15px">Haseeb GLOBAL Admin</h2><input id="u" value="admin"><input id="p" type="password" value="admin123"><button class="btn" onclick="login()">Login - Global Mode</button></div></div>
<div id="dash" class="dash"><div class="sidebar"><h2 style="color:#FFD60A">Haseeb Studio</h2><div class="menu"><div class="active" onclick="show('g',this)">🖼️ Gallery Global</div><div onclick="show('s',this)">⚙️ Settings</div><div onclick="location.reload()">Logout</div></div><div id="st" style="margin-top:20px;font-size:12px;padding:8px;background:#0A0A0A;border-radius:8px;border:1px solid #333">Status: Local</div></div>
<div class="main"><div id="gTab"><div class="glass"><h3>Add New (Sari Dunia Ko Dikhega)</h3><input id="title" placeholder="Title"><input id="cat" placeholder="Category"><input id="img" placeholder="Image URL (imgur direct link)"><button class="btn" onclick="add()">Add + Auto Sync to World 🌍</button></div><div class="glass"><div id="grid" class="grid"></div></div></div>
<div id="sTab" style="display:none"><div class="glass"><h3 style="color:#FFD60A">STEP 1: Token Lagao (1 baar)</h3><input id="tok" placeholder="GitHub Token ghp_..."><input id="repo" value="haseeburrehman2/haseeburrehman2.github.io"><input id="file" value="products.json"><button class="btn" onclick="save()">Save Token</button><p style="font-size:12px;color:#888;margin-top:10px">GitHub > Settings > Developer Settings > Personal access tokens > Generate > repo tick > Copy > Yahan Paste</p></div></div></div></div>
<script>
let products=JSON.parse(localStorage.getItem('admin_products')||'[]');let cfg=JSON.parse(localStorage.getItem('gh_cfg')||'{}');tok.value=cfg.token||'';repo.value=cfg.repo||'haseeburrehman2/haseeburrehman2.github.io';file.value=cfg.file||'products.json';
function login(){if(u.value=='admin'&&p.value=='admin123'){loginBox.style.display='none';dash.style.display='block';render();st.innerHTML=cfg.token?'🌍 Global Ready':'⚠️ Settings me Token lagao'}else alert('wrong')}
function show(t,el){document.querySelectorAll('.menu div').forEach(d=>d.classList.remove('active'));el.classList.add('active');gTab.style.display=t=='g'?'block':'none';sTab.style.display=t=='s'?'block':'none'}
function save(){cfg={token:tok.value.trim(),repo:repo.value.trim(),file:file.value.trim()};localStorage.setItem('gh_cfg',JSON.stringify(cfg));st.innerHTML='🌍 Global Ready';alert('Saved!')}
function render(){grid.innerHTML=products.map((p,i)=>`<div class="item"><img src="${p.src}"><div class="info">${p.title}<div style="color:#FFD60A;font-size:11px">${p.cat}</div><button onclick="del(${i})" style="width:100%;margin-top:6px;background:#ff222222;color:#ff5555;border:1px solid #333;padding:5px;border-radius:5px">Delete</button></div></div>`).join('')||'Empty';localStorage.setItem('admin_products',JSON.stringify(products))}
function add(){if(!title.value||!img.value)return alert('Title+Img');products.unshift({title:title.value,cat:cat.value||'Work',src:img.value});title.value='';cat.value='';img.value='';render();if(cfg.token)sync();else alert('Local Add! Token lagao to Global hoga')}
function del(i){if(confirm('Delete?')){products.splice(i,1);render();if(cfg.token)sync()}}
async function sync(){st.innerHTML='⏳ Syncing...';try{let api=`https://api.github.com/repos/${cfg.repo}/contents/${cfg.file}`;let sha=null;let r=await fetch(api,{headers:{Authorization:`token ${cfg.token}`}});if(r.ok){let j=await r.json();sha=j.sha}let content=btoa(unescape(encodeURIComponent(JSON.stringify(products,null,2))));let put=await fetch(api,{method:'PUT',headers:{Authorization:`token ${cfg.token}`,'Content-Type':'application/json'},body:JSON.stringify({message:'update gallery',content,sha})});if(put.ok){st.innerHTML='✅ LIVE - Sari dunia dekh rahi!';alert('🌍 Ho gaya! Ab sari dunia ko dikhega!')}else{st.innerHTML='❌ Error';alert(await put.text())}}catch(e){alert(e.message);st.innerHTML='❌ Error'}}
</script></body></html>
